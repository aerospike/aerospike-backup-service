apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aerospike-backup-service.fullname" . }}
  labels:
    app: {{ include "aerospike-backup-service.fullname" . }}
    {{- include "aerospike-backup-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aerospike-backup-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ .Values.backupServiceConfig | toString | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: {{ include "aerospike-backup-service.fullname" . }}
        {{- include "aerospike-backup-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aerospike-backup-service.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or (not .Values.configmap.create) .Values.initContainers }}
      initContainers:
      {{- end }}
      {{- if not .Values.configmap.create }}
        - name: config-injector
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          image: "{{ .Values.utilityImage.repository }}:{{ .Values.utilityImage.tag }}"
          imagePullPolicy: {{ .Values.utilityImage.pullPolicy }}
          # The config travels base64-encoded so no character in it ($, `, \, quotes) is ever
          # interpreted by the shell, split into 64 KiB arguments because Linux caps a single
          # exec argument at 128 KiB (MAX_ARG_STRLEN).
          {{- $b64 := .Values.backupServiceConfig | toYaml | b64enc }}
          {{- $chunk := 65536 }}
          command:
            - /bin/sh
            - -c
            - printf '%s' "$@" | base64 -d > /etc/aerospike-backup-service/aerospike-backup-service.yml
            - config-injector
            {{- range $i := until (div (add (len $b64) (sub $chunk 1)) $chunk | int) }}
            - {{ substr (mul $i $chunk | int) (min (len $b64) (mul (add $i 1) $chunk) | int) $b64 | quote }}
            {{- end }}
          volumeMounts:
            - name: aerospike-backup-service-config
              mountPath: /etc/aerospike-backup-service
      {{- end }}
      {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "args.list" . | nindent 12 }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{ with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ include "aerospike-backup-service.httpPort" . }}
              protocol: TCP
            {{- if include "aerospike-backup-service.httpsEnabled" . }}
            - name: https
              containerPort: {{ include "aerospike-backup-service.httpsPort" . }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            {{- include "aerospike-backup-service.probe" (list . .Values.livenessProbe "health") | nindent 12 }}
          readinessProbe:
            {{- include "aerospike-backup-service.probe" (list . .Values.readinessProbe "ready") | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: aerospike-backup-service-config
              mountPath: /etc/aerospike-backup-service
          {{- if .Values.extraVolumeMounts }}
          {{- range .Values.extraVolumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ include "aerospike-backup-service.readOnly" .readOnly }}
          {{- end }}
          {{- end }}
          {{- if .Values.extraSecretVolumeMounts }}
          {{- range .Values.extraSecretVolumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ include "aerospike-backup-service.readOnly" .readOnly }}
              subPath: {{ .subPath }}
          {{- end }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: aerospike-backup-service-config
        {{- if .Values.configmap.create }}
          configMap:
            name: {{ include "aerospike-backup-service.fullname" . }}-cm
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
