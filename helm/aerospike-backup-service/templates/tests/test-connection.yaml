apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "aerospike-backup-service.fullname" . }}-test-connection"
  labels:
    {{- include "aerospike-backup-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: "{{ .Values.utilityImage.repository }}:{{ .Values.utilityImage.tag }}"
      imagePullPolicy: {{ .Values.utilityImage.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ['wget']
      args:
        - '-q'
        - '-O'
        - '/dev/null'
        - 'http://{{ include "aerospike-backup-service.fullname" . }}:{{ .Values.service.port }}{{ include "aerospike-backup-service.contextPath" . }}health'
  restartPolicy: Never
