apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "aerospike-backup-service.fullname" . }}-test-connection"
  labels:
    {{- include "aerospike-backup-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: "{{ .Values.utilityImage.repository }}:{{ .Values.utilityImage.tag }}"
      imagePullPolicy: {{ .Values.utilityImage.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ['wget']
      {{- $scheme := include "aerospike-backup-service.primaryListener" . }}
      args:
        - '--quiet'
        - '--output-document=/dev/null'
        {{- if eq $scheme "https" }}
        - '--no-check-certificate'
        {{- end }}
        - '{{ $scheme }}://{{ include "aerospike-backup-service.fullname" . }}:{{ include "aerospike-backup-service.primaryServicePort" . }}{{ include "aerospike-backup-service.contextPath" . }}health'
  restartPolicy: Never
