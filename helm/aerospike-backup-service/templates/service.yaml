apiVersion: v1
kind: Service
metadata:
  name: {{ include "aerospike-backup-service.fullname" . }}
  labels:
    {{- include "aerospike-backup-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      appProtocol: HTTP
      protocol: TCP
      name: http
    {{- if include "aerospike-backup-service.httpsEnabled" . }}
    - port: {{ .Values.service.httpsPort | default (include "aerospike-backup-service.httpsPort" .) }}
      targetPort: https
      appProtocol: HTTPS
      protocol: TCP
      name: https
    {{- end }}
  selector:
    {{- include "aerospike-backup-service.selectorLabels" . | nindent 4 }}
