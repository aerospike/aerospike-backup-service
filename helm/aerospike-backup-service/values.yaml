# Default values for aerospike-backup-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of Backup Service pods: 1, or 0 to stop the service. Values above 1 are rejected:
# each pod needs its own configuration, and pods of one release share backupServiceConfig.
# Install a separate release for each set of routines.
replicaCount: 1
image:
  repository: aerospike/aerospike-backup-service
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "3.7.0"
imagePullSecrets: []
# Overrides the chart name used in resource names and the app.kubernetes.io/name label.
nameOverride: ""
# Overrides the full resource name (default: <release>-aerospike-backup-service).
fullnameOverride: ""
# Small image used by the config-injector init container (configmap.create: false)
# and by the `helm test` pod. It must provide /bin/sh, base64 and wget.
utilityImage:
  repository: busybox
  tag: "1.37.0"
  pullPolicy: IfNotPresent
configmap:
  # true: backupServiceConfig is rendered into a ConfigMap and mounted read-only at
  #   /etc/aerospike-backup-service. Configuration changes through the REST API are rejected
  #   with 405; change backupServiceConfig and run `helm upgrade` instead.
  # false: an init container writes backupServiceConfig into an emptyDir, so the REST API can
  #   change the configuration. Those changes are lost whenever the pod is recreated.
  create: true
# Command-line arguments for the service. Empty uses
# ["-c", "/etc/aerospike-backup-service/aerospike-backup-service.yml"].
# A non-empty list replaces that default, so include -c yourself. Example (remote config,
# where the mounted file holds the location of the real configuration):
# Chart 2.1.0 and earlier ignored this value. Check it before upgrading from those versions.
# args: ["-c", "/etc/aerospike-backup-service/aerospike-backup-service.yml", "-r"]
args: []
envFrom: []
# - configMapRef:
#     name: config-map-name
# - secretRef:
#     name: secret-name

env: []
# - name: SOME_ENV_VAR
#   value: some-env-var-value
# - name: SOME_ENV_VAR_FROM_CONFIG_MAP
#   valueFrom:
#     configMapKeyRef:
#       name: configmap-name
#       key: config-key
# - name: SOME_ENV_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: secret-name
#       key: secret-key

# The Backup Service configuration file, written to
# /etc/aerospike-backup-service/aerospike-backup-service.yml.
# Unknown keys are rejected at startup. The full field reference is
# https://github.com/aerospike/aerospike-backup-service/tree/main/docs/readme/dto
# (start at dto.config.md) and the JSON schema is docs/config.schema.json.
backupServiceConfig: {}
# service:
#   http:
#     address: <address> # Optional. Default: 0.0.0.0
#     port: <port> # Optional. Default: 8080. The chart uses it for the container port and probes.
#     context-path: <path> # Optional. Default: "/". The chart adds it to the probe paths.
#     disabled: <true/false> # Optional. Default: false
#     rate:
#       tps: <tokens-per-second> # Optional. Default: 1024
#       size: <token-bucket-size> # Optional. Default: 1024
#       white-list: [ <ips> ] # Optional. Default: empty list
#   https: # Optional. Enabled when this block is present. See the chart README, "HTTPS".
#     disabled: <true/false> # Optional. Default: false
#     port: <port> # Optional. Default: 8443. The chart exposes it as port "https".
#     cert-file: <path> # Mandatory when enabled
#     key-file: <path> # Mandatory when enabled
#     client-auth: <mode> # Optional. Default: none. Valid values: none, request, require-and-verify (mTLS)
#     client-ca-file: <path> # Mandatory when client certificates are verified
#     crl-file: <path> # Optional
#   logger:
#     level: <log-level> # Optional. Default: INFO. Valid values: TRACE, DEBUG, INFO, WARN, WARNING, ERROR
#     format: <format> # Optional. Default: PLAIN. Valid values: PLAIN, JSON
#     stdout-writer: <true/false> # Optional. Default: true. Recommended on Kubernetes (kubectl logs).
#     file-writer: # Optional. Needs a writable volume (readOnlyRootFilesystem is on).
#       filename: <filename-path> # Mandatory when file-writer is set
#       maxsize: <max-logfile-size> # Optional. Default: 100 (megabytes)
#       maxage: <max-days-retain-logs> # Optional. Default: keep all
#       maxbackups: <backup-logfiles> # Optional. Default: keep all
#       compress: <true/false> # Optional. Default: false
#   backup:
#     timestamp-format: <ISO|EU|US> # Optional. Human-readable UTC timestamp suffix in backup paths
#     schedule-timezone: <UTC|Local|IANA> # Optional timezone for cron evaluation. Default: UTC. Changing this requires a restart.
#
# aerospike-clusters:
#   <cluster-name>:
#     label: <cluster-label> # Optional. Used only in logs and error messages.
#     seed-nodes: # Mandatory
#       - host-name: <cluster ip/dns-name> # Mandatory
#         port: 3000 # Mandatory
#         tls-name: <tls-name> # Mandatory if TLS is enabled
#     conn-timeout: <connection-timeout> # Optional. Milliseconds, e.g. 5000
#     use-services-alternate: <true/false> # Optional. Default: false
#     max-parallel-scans: <n> # Optional. Shared by all backups of this cluster. Default: unlimited
#     prefer-racks: [ <rack-ids> ] # Optional. Racks to read from, in order of preference
#     credentials:
#       user: <cluster username>
#       password: <cluster password> # Use password-path or a Secret Agent instead in production
#       password-path: <path-to-password-file> # e.g. a file mounted from a Kubernetes Secret
#       auth-mode: <auth-mode> # Optional. Default: INTERNAL. Valid values: INTERNAL, EXTERNAL, PKI
#       secret-agent-name: <agent-name> # Optional. Mutually exclusive with secret-agent
#       secret-agent: <inline secret agent> # Optional. Same fields as secret-agents.<agent-name>
#     tls:
#       ca-file: <path-to-ca-file> # Mandatory if TLS is enabled and ca-path is empty
#       ca-path: <path-to-ca-directory> # Mandatory if TLS is enabled and ca-file is empty
#       name: <tls-name> # Mandatory if TLS is enabled
#       protocols: <protocols> # Optional
#       cipher-suite: <cipher-suite> # Optional
#       cert-file: <path-to-cert-file> # Optional
#       key-file: <path-to-key-file> # Optional
#       key-file-password: <keyfile-password> # Optional
#
# storage:
#   <storage-name>: # Each named storage sets exactly one of the backends below.
#     local-storage:
#       path: <root-path> # Mandatory. Needs a writable, persistent volume mounted at this path.
#       min-part-size: <bytes> # Optional
#   <s3-storage-name>:
#     s3-storage:
#       bucket: <bucket> # Mandatory
#       s3-region: <s3-region> # Mandatory, e.g. us-east-1
#       path: <root-path> # Optional. Root path inside the bucket.
#       s3-profile: <s3-profile> # Optional. Profile in ~/.aws/credentials (/home/absuser/.aws/credentials)
#       s3-endpoint-override: <s3-endpoint> # Optional, e.g. http://minio:9000
#       s3-log-level: <level> # Optional. Default: FATAL. Valid values: OFF, FATAL, ERROR, WARN, INFO, DEBUG, TRACE
#       min-part-size: <bytes> # Optional. Default: 52428800
#       max-async-connections: <n> # Optional. Default: 16
#       access-key-id: <access-key-id> # Optional. Static credentials; omit to use the default AWS chain (e.g. IRSA)
#       secret-access-key: <secret-access-key> # Optional
#       secret-agent-name: <agent-name> # Optional. Mutually exclusive with secret-agent
#       storage-class: # Optional
#         data: <STANDARD/GLACIER/etc> # Storage class for object data
#         metadata: <STANDARD/GLACIER/etc> # Storage class for metadata
#   <gcp-storage-name>:
#     gcp-storage:
#       bucket-name: <bucket-name> # Mandatory
#       path: <root-path> # Optional. Default: bucket root
#       key-file-path: <key-file-path> # Optional. Service account key (JSON) file; omit to use Workload Identity / ADC
#       key: <key> # Optional. Service account key (JSON) inline. Sensitive.
#       endpoint: <endpoint> # Optional. Not recommended for production
#       min-part-size: <bytes> # Optional. Default: 52428800
#       secret-agent-name: <agent-name> # Optional. Mutually exclusive with secret-agent
#       storage-class: # Optional
#         data: <STANDARD/NEARLINE/etc> # Storage class for object data
#   <azure-storage-name>:
#     azure-storage:
#       endpoint: <endpoint> # Mandatory. Blob service endpoint URL
#       container-name: <container-name> # Mandatory
#       path: <root-path> # Optional. Default: container root
#       account-name: <account-name> # Optional. Shared Key authentication
#       account-key: <account-key> # Optional. Shared Key authentication
#       tenant-id: <tenant-id> # Optional. Entra ID (AAD) authentication
#       client-id: <client-id> # Optional. Entra ID (AAD) authentication
#       client-secret: <client-secret> # Optional. Entra ID (AAD) authentication
#       min-part-size: <bytes> # Optional. Default: 52428800
#       secret-agent-name: <agent-name> # Optional. Mutually exclusive with secret-agent
#       storage-class: # Optional
#         data: <Hot/Cool/Cold/Archive> # Access tier for object data
#         metadata: <Hot/Cool/Cold/Archive> # Access tier for metadata
#
# backup-policies:
#   <policy-name>:
#     parallel: <n> # Optional. Max parallel scan calls. Default: 8
#     parallel-write: <n> # Optional. Writer threads. Default: same as parallel
#     max-concurrent-nodes: <n> # Optional. Default: all nodes in parallel
#     socket-timeout: <ms> # Optional. 0 means total-timeout is used
#     total-timeout: <ms> # Optional. Default: 0 (no timeout)
#     retry-policy: # Optional. Default: 5 retries, 1 minute base delay, multiplier 1.5
#       base-timeout: <ms> # Initial delay between retry attempts
#       multiplier: <multiplier> # Factor to increase the delay between retries
#       max-retries: <n> # Maximum number of retries. 0 means no retries
#     retention:
#       full: <n> # Optional. Number of full backups to keep. Default: all
#       incremental: <n> # Optional. Number of full backups to keep incremental backups for. Default: all
#     no-records: <true/false> # Optional. Do not back up record data. Default: false
#     no-indexes: <true/false> # Optional. Do not back up secondary index definitions. Default: false
#     no-udfs: <true/false> # Optional. Do not back up UDF modules. Default: false
#     with-cluster-configuration: <true/false> # Optional. Back up cluster configuration. Default: false
#     bandwidth: <MiB/s> # Optional. Default: no limit
#     records-per-second: <n> # Optional. Default: no limit
#     file-limit: <MiB> # Optional. .asb file size limit. Default: 250
#     compact: <true/false> # Optional. Do not base64-encode BLOBs. Default: false
#     use-scan-compression: <true/false> # Optional. Enterprise Edition only. Default: false
#     encryption:
#       mode: <mode> # Required. Valid values: NONE, AES128, AES256
#       key-file: <path> # Exactly one key source is required unless mode is NONE
#       key-env: <env-var-name> # Environment variable holding the key (see `env` above)
#       key-secret: <secret-agent-key> # Key resolved through the routine's Secret Agent
#     compression:
#       mode: <mode> # Required. Valid values: NONE, ZSTD
#       level: <level> # -1 to 22. Required for ZSTD, must not be set for NONE
#     sealed: <true/false> # Optional. Exclude records updated during the backup. Default: false
#     concurrent-incremental: <true/false> # Optional. Allow incremental backups to overlap. Default: false
#     incr-mode: <mode> # Optional. differential (default) or cumulative
#
# backup-routines:
#   <routine-name>:
#     source-cluster: <cluster-name> # Mandatory. Key under aerospike-clusters
#     storage: <storage-name> # Mandatory. Key under storage
#     interval-cron: <cron> # Mandatory. Full backup schedule
#     namespaces: [ <namespace-name> ] # Mandatory. Empty list backs up the whole cluster
#     backup-policy: <policy-name> # Optional. Key under backup-policies
#     incr-interval-cron: <cron> # Optional. Incremental backup schedule
#     schedule-timezone: <UTC|Local|IANA> # Optional. Overrides service.backup.schedule-timezone. Default: inherit
#     secret-agent: <agent-name> # Optional. Key under secret-agents; resolves encryption key-secret
#     set-list: [ <set-names> ] # Optional. Default: all sets
#     bin-list: [ <bin-names> ] # Optional. Default: all bins
#     rack-list: [ <rack-ids> ] # Optional. Only scan nodes in these racks
#     partition-list: <partition-list> # Optional. e.g. "0-1000"
#     node-list: [ <nodes> ] # Optional. Default: all nodes
#     filter-exp: <base64-expression> # Optional. Partial backup filter expression
#     disabled: <true/false> # Optional. Disable scheduled backups. Default: false
#
# secret-agents:
#   <agent-name>:
#     connection-type: <TCP/UNIX> # Mandatory
#     address: <address> # Mandatory
#     port: <port> # Port of a TCP agent
#     timeout: <ms> # Optional. Default: 1000
#     is-base64: <true/false> # Optional. Default: false
#     ca-file: <path> # Optional. Trusted CA for TLS to the agent
#     name: <tls-server-name> # Optional. TLS ServerName (SNI)
#     cert-file: <path> # Optional. Client certificate for mTLS
#     key-file: <path> # Optional. Client key for mTLS

# Extra init containers added to the pod, after config-injector.
initContainers: []
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Value of automountServiceAccountToken on the ServiceAccount object.
  # ABS does not call the Kubernetes API, and the pod spec always sets
  # automountServiceAccountToken: false, so the token is never mounted.
  automount: false
  # Annotations to add to the service account, e.g. for IRSA or GKE Workload Identity:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
  #   iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container securityContext is hardened by default.
# readOnlyRootFilesystem: true means file-based local storage or a log file needs a
# writable volume (volumes + extraVolumeMounts with readOnly: false).
# See the chart README, "Writable paths".
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  # Matches USER absuser (uid 65532) and group abgroup (gid 65532) in the official image.
  # runAsGroup is declared explicitly rather than inherited from the image so the
  # rendered manifest is self-describing (and so static scanners can see it).
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
service:
  type: ClusterIP
  # Service port for HTTP. The container port comes from backupServiceConfig.service.http.port
  # (default 8080); the Service forwards to it by name.
  port: 8080
  # Service port for HTTPS, added when backupServiceConfig.service.https is enabled.
  # Default: the container port, backupServiceConfig.service.https.port (default 8443).
  # Probes, the chart notes and `helm test` keep using HTTP.
  httpsPort: null
ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

# Without a handler (httpGet, tcpSocket, exec or grpc) of your own, the chart adds
# httpGet <context-path>health / <context-path>ready on the container's "http" port.
livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
readinessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
# ABS stops accepting requests and drains the HTTP server for up to 30 seconds on shutdown;
# this leaves headroom before the kubelet sends SIGKILL.
terminationGracePeriodSeconds: 45
# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts for entries in `volumes`. readOnly defaults to true.
# For local storage or a log file under readOnlyRootFilesystem, mount a writable,
# persistent volume and set readOnly: false. Example:
# volumes:
#   - name: backups
#     persistentVolumeClaim:
#       claimName: abs-backups
# extraVolumeMounts:
#   - name: backups
#     mountPath: /backup
#     readOnly: false
extraVolumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true
# Like extraVolumeMounts, but each entry also takes subPath to mount a single key
# of a Secret as a file. readOnly defaults to true.
extraSecretVolumeMounts: []
# - name: foo
#   mountPath: "/etc/foo/password.txt"
#   subPath: password.txt
#   readOnly: true

nodeSelector: {}
tolerations: []
affinity: {}
