run:
  timeout: 2m
linters:
  disable-all: true
  enable:
    - gci
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gci
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - gocyclo
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - nakedret
    - nestif
    - nlreturn
    - prealloc # pre-allocate slices with define size if the slice size is known in advance
    - predeclared
    - promlinter
    - reassign
    - revive
    - sloglint
    - staticcheck
    - stylecheck
    - thelper
    - tparallel
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - lll

linters-settings:
  gosec:
    excludes:
      - G115
  nlreturn:
    block-size: 10

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
        - prealloc
        - funlen
        - goconst
        - nlreturn

  exclude-dirs:
    - examples
    - modules
    - docs
    - docker
