version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - sloglint
    - staticcheck
    - tagliatelle
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - whitespace
  settings:
    godot:
      exclude:
        - '@(Success|Failure|Router).*'
    gosec:
      excludes:
        - G115
    gocognit:
      min-complexity: 25
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: '^json\.Marshal$'
          msg: use decoder.Marshal instead
        - pattern: '^json\.MarshalIndent$'
          msg: use decoder.Marshal instead
        - pattern: '^json\.NewEncoder$'
          msg: use decoder.Marshal instead
        - pattern: '^json\.Unmarshal$'
          msg: use decoder.Deserialize instead
        - pattern: '^json\.NewDecoder$'
          msg: use decoder.Deserialize instead
        - pattern: '^yaml\.Marshal$'
          msg: use decoder.Marshal instead
        - pattern: '^yaml\.Unmarshal$'
          msg: use decoder.Deserialize instead
        - pattern: '^yaml\.NewEncoder$'
          msg: use decoder.Marshal instead
        - pattern: '^yaml\.NewDecoder$'
          msg: use decoder.Deserialize instead
        - pattern: '^time\.Sleep$'
          msg: 'not cancellable; use select { case <-time.After(d): case <-ctx.Done(): }'
        - pattern: '^context\.Background$'
          msg: pass the caller's context, or context.WithoutCancel(ctx) for cleanup after cancellation
        - pattern: '^context\.TODO$'
          msg: pass the caller's context, or context.WithoutCancel(ctx) for cleanup after cancellation
    nlreturn:
      block-size: 10
    misspell:
      locale: US
    tagliatelle:
      case:
        rules:
          json: kebab
          yaml: kebab
    sloglint:
      attr-only: true
      key-naming-case: camel
      forbidden-keys:
        - err
    revive:
      rules:
        - name: exported
          arguments:
            - checkPublicInterface
            - checkPrivateReceivers
          exclude:
            - test
        - name: unexported-return
        - name: import-shadowing
        - name: use-waitgroup-go
        - name: time-equal
    usetesting:
      context-background: true
      context-todo: true
      os-temp-dir: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
        path: pkg/dto/decoder/
      # main owns the root context: signal.NotifyContext(context.Background(), …)
      # is where cancellation starts, so it is the one place that may create one.
      - linters:
          - forbidigo
        path: cmd/backup/main\.go
      - linters:
          - forbidigo
        path: build/
      - linters:
          - forbidigo
        path: docs/
      - linters:
          - forbidigo
        path: _test\.go
      - linters:
          - errcheck
          - funlen
          - goconst
          - nlreturn
          - prealloc
          - unparam
        path: _test\.go
    paths:
      # zz_*_test.go are throwaway audit scratch files, not part of the suite.
      - zz_.*_test\.go$
      - examples
      - modules
      - docs
      - docker
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - zz_.*_test\.go$
      - examples
      - modules
      - docs
      - docker
      - third_party$
      - builtin$
      - examples$
