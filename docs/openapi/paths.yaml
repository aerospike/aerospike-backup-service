# -------------------------------------------------------------------------
# ACTIVE BACKUP JOBS
# -------------------------------------------------------------------------
/backup-jobs:
  get:
    tags: [ Backup ]
    summary: List active backup jobs
    operationId: getOngoingBackups
    description: |
      Retrieve a list of currently running or queued backup tasks. 
      Completed jobs may remain visible here for a short period.
    parameters:
      - name: routine
        in: query
        description: Filter jobs by routine name.
        schema:
          type: string
      - name: type
        in: query
        description: Filter by backup type.
        schema:
          $ref: "./schemas.yaml#/BackupType"
      - name: status
        in: query
        description: Filter by one or more job statuses.
        schema:
          type: array
          items:
            $ref: "./schemas.yaml#/JobStatus"
        style: form
        explode: true
    responses:
      '200':
        description: A list of active job resources.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "./schemas.yaml#/BackupJob"
  
  post:
    tags: [ Backup Control ]
    summary: Trigger a new backup job
    description: |
      Starts a new long-running backup task.
    operationId: triggerBackupJob
    requestBody:
      description: Configuration for the new backup task.
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/BackupTrigger"
    responses:
      '202':
        description: Job accepted and started.
        headers:
          Location:
            description: URI of the newly created job resource.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/JobIdentifier"
      '409':
        headers:
          Location:
            description: URI of existing backup operation.
            schema:
              type: string
        description: Conflict. A job for this routine is already running.

/backup-jobs/{id}:
  get:
    tags: [ Backup ]
    summary: Get job status
    description: |
      Fetch the current status of a specific long-running action.
      Poll this endpoint to track progress.
    parameters:
      - name: id
        in: path
        required: true
        description: The unique ID of the backup job.
        schema:
          type: string
    responses:
      '200':
        description: Current state of the job.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/BackupJob"
      '404':
        description: Job ID not found.
  delete:
    tags: [ Backup ]
    summary: Cancel job
    description: |
      Terminates the running backup. All the data already backed up to the storage will be deleted.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: Cancellation request processed successfully. No content returned.
      '404':
        description: Job not found.

# -------------------------------------------------------------------------
# BACKUP HISTORY
# -------------------------------------------------------------------------
/backups:
  get:
    tags: [ Backup ]
    summary: List backup history
    description: |
      Retrieve the historical list of successfully completed backups.
      Supports strict pagination via `limit` and `offset`.
    parameters:
      - name: limit
        in: query
        description: Maximum number of records to return.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        description: Number of records to skip.
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: routine
        in: query
        description: Filter history by routine name.
        schema:
          type: string
      - name: type
        in: query
        description: Filter history by backup type.
        schema:
          $ref: "./schemas.yaml#/BackupType"

    responses:
      '200':
        description: Paginated list of backup artifacts.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/PaginatedBackupHistory"

/backups/{id}:
  get:
    tags: [ Backup ]
    summary: Get backup details
    description: Returns metadata for a single completed backup artifact.
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the finished artifact (e.g., `bck-2023-10-01`).
        schema:
          type: string
    responses:
      '200':
        description: Backup artifact details.
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/BackupDetails"
      '404':
        description: Backup not found.

