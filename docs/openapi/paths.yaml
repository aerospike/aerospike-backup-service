# -------------------------------------------------------------------------
# RESTORES
# -------------------------------------------------------------------------
/restore-jobs:
  get:
    tags: [ Restore ]
    summary: List active restore jobs.
    description: Returns a list of currently running or recently finished restore operations.
    parameters:
      - name: status
        in: query
        description: Filter by one or more job statuses.
        schema:
          type: array
          items:
            $ref: "./schemas.yaml#/JobStatus"
        style: form
        explode: true
    responses:
      '200':
        description: List of restore jobs
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "./schemas.yaml#/RestoreJob"

/restore-jobs/{id}:
  get:
    tags: [ Restore ]
    summary: Get restore job status.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Job status
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/RestoreJob"
      '404':
        description: Job not found

  delete:
    tags: [ Restore ]
    summary: Cancel a running restore.
    description: Stops the restoration process immediately. Replaces `/restore/cancel`.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      '204':
        description: Cancellation accepted (No Content).
      '404':
        description: Job not found or already finished.

# Method A: Restore by Timestamp
/restore-jobs/point-in-time:
  post:
    tags: [ Restore Control ]
    summary: Trigger restore by timestamp.
    description: |
      Starts a restore job calculated from a specific point in time.
      Corresponds to the `RestoreTimestampRequest` schema.
    operationId: triggerRestoreByTime
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/RestoreTimestampRequest"
    responses:
      '202':
        description: Restore started.
        headers:
          Location:
            description: URI of the new job (e.g., /restore-jobs/job-99)
            schema: { type: string }
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/JobIdentifier"

# Method B: Restore by Artifact (Path/File)
/restore-jobs/path:
  post:
    tags: [ Restore Control ]
    summary: Trigger restore by backup path.
    description: |
      Starts a restore job using a specific path or backup key.
      Replaces `/restore/full` and `/restore/incremental`.
    operationId: triggerRestoreByPath
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/RestoreRequest"
    responses:
      '202':
        description: Restore started.
        headers:
          Location:
            schema: { type: string }
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/JobIdentifier"

/retrieve/configuration/{name}/{timestamp}:
  get:
    tags: [ Restore ]
    summary: Retrieve Aerospike cluster configuration backup
    operationId: retrieveConfiguration
    parameters:
      - description: Backup routine name
        name: name
        in: path
        required: true
        schema:
          type: string
      - description: Backup timestamp
        name: timestamp
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: OK
        content:
          application/zip:
            schema:
              type: string
              format: binary
      '400':
        description: Bad Request
        content:
          application/zip:
            schema:
              type: string
      '405':
        description: Method Not Allowed
        content:
          application/zip:
            schema:
              type: string
