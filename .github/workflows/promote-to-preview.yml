name: Promote Release Bundle (STAGE or PREVIEW)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release bundle version to promote (e.g. v3.7.0)
        required: true
        type: string
      environment:
        description: Promotion target — STAGE (from TEST, QE/dev) or PREVIEW (from STAGE, Product)
        required: true
        type: choice
        default: STAGE
        options:
          - STAGE
          - PREVIEW

permissions:
  contents: read

# Promotes an already-created release bundle (in the "database" JFrog project) to STAGE or PREVIEW.
# This is an alternative to doing the same promotion via the JFrog UI -- either works. No GitHub-side
# approval gate is enforced here -- anyone who can trigger workflow_dispatch on this repo can run
# this, so treat it the same as JFrog UI access: only run it once the prior stage has been validated.
#
#   TEST  --(target STAGE)-->   STAGE
#   STAGE --(target PREVIEW)--> PREVIEW

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      BUNDLE_NAME: ${{ github.event.repository.name }}
      BUNDLE_VERSION: ${{ inputs.version }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Login to JFrog
        uses: step-security/setup-jfrog-cli@9d5fe0e81fc593a6c0c39bf83ad9a7b45587eed0 # v5.3.1
        env:
          JF_URL: ${{ vars.JF_ARTIFACTORY_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JF_OIDC_AUDIENCE }}

      - name: Promote release bundle
        uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@308f37e0cd5c7a6386a99ea7afc379d5a4ea9256 # v5.1.0
        with:
          bundle-name: ${{ env.BUNDLE_NAME }}
          version: ${{ env.BUNDLE_VERSION }}
          environment: ${{ env.TARGET_ENV }}
          jf-project: ${{ vars.JF_PROJECT }}

      - name: Summarize promotion
        if: always()
        run: |
          {
            echo "### Promoted to JFrog ${TARGET_ENV}"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Bundle name | \`${BUNDLE_NAME}\` |"
            echo "| Bundle version | \`${BUNDLE_VERSION}\` |"
            echo "| JFrog project | \`${{ vars.JF_PROJECT }}\` |"
            echo ""
            if [ "${TARGET_ENV}" = "STAGE" ]; then
              echo "Next: a PM/EM promotes to PREVIEW (via promote-to-preview.yml with environment PREVIEW, or the JFrog UI)."
            else
              echo "Next: a PM/EM promotes to PROD (via promote-to-prod.yml or the JFrog UI)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
