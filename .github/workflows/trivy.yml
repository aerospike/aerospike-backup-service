name: Trivy security scan

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Scan filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: tmp,.git
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Enforce HIGH and CRITICAL findings policy
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs tmp,.git \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 \
            .

      # `trivy fs` renders the Helm chart with its DEFAULT values, i.e.
      # configmap.create: true. The config-injector init container only exists when
      # that value is false, so the scan above cannot see it at all. Scan the
      # init-container path explicitly. Trivy renders Helm natively, so no helm
      # binary or extra action is needed.
      - name: Generate Trivy SARIF report (Helm init-container path)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: helm/aerospike-backup-service
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-helm-initcontainer.sarif
          exit-code: '0'
        env:
          TRIVY_HELM_SET: configmap.create=false

      - name: Enforce HIGH and CRITICAL findings policy (Helm init-container path)
        run: |
          trivy config \
            --helm-set configmap.create=false \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 \
            helm/aerospike-backup-service

      - name: Upload Trivy results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Helm init-container results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-helm-initcontainer.sarif
          category: helm-initcontainer
