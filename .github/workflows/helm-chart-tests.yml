name: Test Chart Install and Tests
on:
  pull_request:
    paths:
      - helm/aerospike-backup-service/**
      - .github/workflows/helm-chart-tests.yml
      - .github/actions/seed-and-verify-aerospike/**
      - .github/actions/poll-abs-job/**
      - .github/actions/deploy-aerospike-cluster/**
      - .github/actions/minio/**
      - .github/config/test-chart-abs-conf.yaml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-charts:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            helm/aerospike-backup-service
          sparse-checkout-cone-mode: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (lint)
        run: |
          cd helm/aerospike-backup-service
          ct lint --chart-dirs . --charts .

  test-chart:
    runs-on: ubuntu-24.04
    env:
      NAMESPACE: aerospike
      ASDB_NAMESPACE: test
      BUCKET: abs-testing-bucket
      RECORD_COUNT: 1000
      ROUTINE: minioKeepFilesRoutine
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install yq
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b #v1.3.1
        with:
          version: "v4.45.4"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Set up Chart Testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Create Kind Cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Build ABS Docker Container and Load to Kind Cluster
        run: |
          IMAGE_TAG="chart-testing" make docker-build
          kind load docker-image aerospike/aerospike-backup-service:chart-testing --name chart-testing

      - name: Setup Prerequisites
        run: |
          echo "Deploying AKO"

          curl -sL https://github.com/operator-framework/operator-lifecycle-manager/releases/download/v0.35.0/install.sh | bash -s v0.35.0

          kubectl create -f https://operatorhub.io/install/aerospike-kubernetes-operator.yaml
          AKO_CSV_NAME="aerospike-kubernetes-operator.$(curl -s https://api.github.com/repos/aerospike/aerospike-kubernetes-operator/releases/latest | jq -r '.tag_name')"

          echo "Waiting for AKO"
          echo "Waiting for CSV to be created"
          kubectl wait --for=create "csv/$AKO_CSV_NAME" --namespace operators --timeout=300s
          echo "Waiting for CSV to be in Succeeded phase"
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded "csv/$AKO_CSV_NAME" --namespace operators --timeout=300s
          echo "Waiting for operator pods to be ready"
          kubectl wait --for=condition=Ready pod --all --namespace operators --timeout=300s

          echo "Grant permissions to the target namespace"
          kubectl create namespace aerospike
          kubectl --namespace aerospike create serviceaccount aerospike-operator-controller-manager
          kubectl create clusterrolebinding aerospike-cluster --clusterrole=aerospike-cluster --serviceaccount=aerospike:aerospike-operator-controller-manager

          echo "Set Secrets for Aerospike Cluster"
          kubectl --namespace aerospike create secret generic aerospike-secret --from-literal=features.conf="$(echo "${{ secrets.FEATURES_CONF }}")"
          kubectl --namespace aerospike create secret generic minio-credentials --from-file=credentials=<(cat <<EOF
          [minio]
          aws_access_key_id=minioadmin
          aws_secret_access_key=minioadmin
          EOF
          )

      - name: Deploy the Aerospike cluster
        uses: ./.github/actions/deploy-aerospike-cluster
        with:
          kubectl-namespace: ${{ env.NAMESPACE }}
          asdb-namespace: ${{ env.ASDB_NAMESPACE }}

      - name: Deploy MinIO
        uses: ./.github/actions/minio
        with:
          mode: deploy
          kubectl-namespace: ${{ env.NAMESPACE }}
          bucket: ${{ env.BUCKET }}

      - name: Run chart-testing (install)
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          yq eval '. as $item ireduce ({}; .backupServiceConfig = $item)' .github/config/test-chart-abs-conf.yaml > abs-values.yaml
          cat <<EOF > ct-values.yaml
          volumes:
            - name: minio-credentials
              secret:
                secretName: minio-credentials
                optional: false
          extraSecretVolumeMounts:
            - name: minio-credentials
              mountPath: /home/absuser/.aws/credentials
              subPath: credentials
              readOnly: true
          image:
            pullPolicy: IfNotPresent
            tag: chart-testing
          configmap:
            create: false
          EOF

          # --skip-clean-up keeps the release after its helm test so the steps below can run a real
          # backup and restore through it. The kind cluster is discarded with the runner.
          # --charts installs the chart even when the PR changed only this workflow or its actions;
          # change detection against the target branch would install nothing and break the steps below.
          ct install \
          --namespace aerospike \
          --charts helm/aerospike-backup-service \
          --skip-clean-up \
          --debug --helm-extra-args="--debug" \
          --helm-extra-set-args="--values=ct-values.yaml --values=abs-values.yaml"

      - name: Discover ABS service and wait for readiness
        id: discover
        run: |
          set -euo pipefail
          SVC="$(kubectl get svc -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=aerospike-backup-service -o jsonpath='{.items[0].metadata.name}')"
          echo "svc=${SVC}" >> "$GITHUB_OUTPUT"
          # Wait on the Deployment: the pod label also matches the finished `helm test` pod,
          # which ends Completed and never becomes Ready. The Deployment shares the Service name.
          kubectl wait --for=condition=Available "deployment/${SVC}" -n ${{ env.NAMESPACE }} --timeout=180s

      - name: Seed records
        uses: ./.github/actions/seed-and-verify-aerospike
        with:
          mode: seed
          namespace: ${{ env.ASDB_NAMESPACE }}
          record-count: ${{ env.RECORD_COUNT }}
          kubectl-namespace: ${{ env.NAMESPACE }}
          aerospike-k8s-host: aerocluster-0-0:3000

      - name: Count seeded records
        id: seed-count
        uses: ./.github/actions/seed-and-verify-aerospike
        with:
          mode: count
          namespace: ${{ env.ASDB_NAMESPACE }}
          kubectl-namespace: ${{ env.NAMESPACE }}
          aerospike-k8s-host: aerocluster-0-0:3000

      - name: Assert seeded count
        run: |
          if [ "${{ steps.seed-count.outputs.record_count }}" != "${{ env.RECORD_COUNT }}" ]; then
            echo "::error::Expected ${{ env.RECORD_COUNT }} records after seeding, got ${{ steps.seed-count.outputs.record_count }}"
            exit 1
          fi

      - name: Port-forward ABS service
        run: |
          kubectl port-forward -n ${{ env.NAMESPACE }} svc/${{ steps.discover.outputs.svc }} 8080:8080 &
          echo $! > port-forward.pid
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:8080/health && break
            [ "$i" -eq 10 ] && { echo "::error::port-forward to ABS never became reachable"; exit 1; }
            sleep 3
          done

      - name: Trigger full backup
        run: curl -sf -X POST "http://127.0.0.1:8080/v1/backups/full/${{ env.ROUTINE }}"

      - name: Wait for the backup
        id: backup
        uses: ./.github/actions/poll-abs-job
        with:
          base-url: http://127.0.0.1:8080
          kind: backup
          routine: ${{ env.ROUTINE }}

      - name: Verify backup files in MinIO
        uses: ./.github/actions/minio
        with:
          mode: list-objects
          kubectl-namespace: ${{ env.NAMESPACE }}
          bucket: ${{ env.BUCKET }}

      - name: Truncate namespace
        run: |
          kubectl exec -n ${{ env.NAMESPACE }} aerocluster-0-0 -- \
            asinfo -v "truncate-namespace:namespace=${{ env.ASDB_NAMESPACE }}"

      - name: Wait for the namespace to drain
        uses: ./.github/actions/seed-and-verify-aerospike
        with:
          mode: wait-empty
          namespace: ${{ env.ASDB_NAMESPACE }}
          kubectl-namespace: ${{ env.NAMESPACE }}
          aerospike-k8s-host: aerocluster-0-0:3000

      - name: Trigger restore
        id: restore
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sf -X POST "http://127.0.0.1:8080/v1/restore/full" \
            -H 'Content-Type: application/json' \
            -d '{
              "destination-name": "asdb-cluster",
              "source-name": "minio",
              "backup-data-path": "${{ steps.backup.outputs.backup-data-path }}",
              "policy": {}
            }')"
          echo "$RESPONSE"
          # POST /v1/restore/full returns a bare job id.
          JOB_ID="$(printf '%s' "$RESPONSE" | tr -d '[:space:]')"
          if ! printf '%s' "$JOB_ID" | grep -qE '^[0-9]+$'; then
            echo "::error::Expected a numeric job id from /v1/restore/full, got: ${RESPONSE}"
            exit 1
          fi
          echo "job-id=${JOB_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for the restore
        uses: ./.github/actions/poll-abs-job
        with:
          base-url: http://127.0.0.1:8080
          kind: restore
          job-id: ${{ steps.restore.outputs.job-id }}

      - name: Count restored records
        id: final-count
        uses: ./.github/actions/seed-and-verify-aerospike
        with:
          mode: count
          namespace: ${{ env.ASDB_NAMESPACE }}
          kubectl-namespace: ${{ env.NAMESPACE }}
          aerospike-k8s-host: aerocluster-0-0:3000

      - name: Assert restored count
        run: |
          if [ "${{ steps.final-count.outputs.record_count }}" != "${{ env.RECORD_COUNT }}" ]; then
            echo "::error::Expected ${{ env.RECORD_COUNT }} records after restore, got ${{ steps.final-count.outputs.record_count }}"
            exit 1
          fi
          echo "Helm backup/restore test passed."

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide || true
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by=.lastTimestamp | tail -50 || true
          kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=aerospike-backup-service --all-containers --tail=300 || true
          for pod in aerocluster-0-0 aerocluster-0-1; do
            kubectl logs "$pod" -c aerospike-server --namespace ${{ env.NAMESPACE }} --tail=100 || true
          done
