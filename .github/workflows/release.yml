name: Publish Aerospike Backup Service Release (Shared Workflows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (must match a release bundle already promoted to PROD, e.g. v3.7.0)
        required: true
        type: string

permissions:
  contents: read

# This workflow is run manually, once the release bundle has already been promoted all the way to
# JFrog PROD via the JFrog UI by a PM/EM (see docs/development.md "Cutting a release" -- gates past
# TEST are product-owned and intentionally not automated in CI). It never promotes anything itself;
# it only verifies the PROD promotion happened, then republishes the already-signed artifacts as an
# immutable GitHub pre-release. A PM/EM promotes it to a full (non-prerelease) GitHub Release manually
# when ready to announce GA. Nothing is rebuilt, re-signed, or re-checksummed here -- JFrog is the
# source of truth.
#
# It publishes to no external registry, by policy. Docker Hub and every other public registry are
# served exclusively by the central artifact-publisher repository, triggered by JFrog's
# release_bundle_v2_promotion_completed webhook on PROD -- see "Strategy for Distributing Released
# Artifacts to Public Registries" (https://aerospike.atlassian.net/wiki/spaces/DevOps/pages/4648566799),
# which rules out per-product publishing workflows so external registry credentials live in one
# audited place. That includes moving tags such as `latest`: this repository must not push them.
#
# All `vars.JF_*` used below are dedicated to this pipeline (targets the "database" JFrog
# project) and are independent of the unprefixed `vars.*` used by release-legacy.yml
# (targets "ecosystem") — never share values between the two.

jobs:
  verify-prod-promotion:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    env:
      BUNDLE_NAME: ${{ github.event.repository.name }}
      BUNDLE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Login to JFrog
        id: jfrog-login
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: ${{ vars.JF_ARTIFACTORY_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JF_OIDC_AUDIENCE }}

      # The Lifecycle API lives at the JFrog *platform* root, not under the Artifactory
      # service path: `jf rt curl` prefixes every request with /artifactory and 404s on
      # /lifecycle/... (verified live against aerospike.jfrog.io -- the platform-root URL
      # returns the promotion records, the /artifactory-prefixed one is Not Found). Call it
      # with plain curl and the OIDC token from setup-jfrog-cli instead. No `set -x`: the
      # bearer token must not land in the trace log.
      - name: Check release bundle is promoted to PROD
        env:
          JF_PROJECT: ${{ vars.JF_PROJECT }}
          JF_PLATFORM_URL: ${{ vars.JF_ARTIFACTORY_URL }}
          JF_TOKEN: ${{ steps.jfrog-login.outputs.oidc-token }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE_VERSION}" ]; then
            echo "::error::version input is required (e.g. v3.7.0)."
            exit 1
          fi

          # Normalize in case the var carries the Artifactory service URL rather than the
          # platform root (setup-jfrog-cli accepts either).
          PLATFORM_URL="${JF_PLATFORM_URL%/}"
          PLATFORM_URL="${PLATFORM_URL%/artifactory}"

          echo "Checking promotion history for ${BUNDLE_NAME}:${BUNDLE_VERSION} (project: ${JF_PROJECT})..."
          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${JF_TOKEN}" -H "Accept: application/json" \
            "${PLATFORM_URL}/lifecycle/api/v2/promotion/records/${BUNDLE_NAME}/${BUNDLE_VERSION}?project=${JF_PROJECT}")

          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::No release bundle ${BUNDLE_NAME}:${BUNDLE_VERSION} found in project ${JF_PROJECT}. Check the version input against the bundles in the JFrog UI."
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Promotion-records lookup failed with HTTP ${HTTP_CODE}; refusing to publish without proof of PROD promotion."
            cat response.json || true
            exit 1
          fi
          jq . response.json

          COMPLETED_PROD=$(jq '[.promotions[]? | select(.environment == "PROD" and .status == "COMPLETED")] | length' response.json)
          if [ "$COMPLETED_PROD" -lt 1 ]; then
            echo "::error::Release bundle ${BUNDLE_NAME}:${BUNDLE_VERSION} has no COMPLETED promotion to PROD. Have a PM/EM promote it via the JFrog UI, then re-run this workflow."
            exit 1
          fi

          echo "Confirmed: ${BUNDLE_NAME}:${BUNDLE_VERSION} is promoted to PROD."

      - name: Summarize verification
        if: always()
        run: |
          {
            echo "### PROD promotion check"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Bundle name | \`${BUNDLE_NAME}\` |"
            echo "| Bundle version | \`${BUNDLE_VERSION}\` |"
            echo "| JFrog project | \`${{ vars.JF_PROJECT }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-github-release:
    needs: [verify-prod-promotion]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    env:
      BUNDLE_NAME: ${{ github.event.repository.name }}
      BUNDLE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Needed only to read the Helm chart's own version out of Chart.yaml at this tag --
      # the chart's version is tracked independently of the package version (see prepare's
      # HELM_VERSION vs PACKAGE_VERSION in pre-release.yml), so it can't be derived from
      # BUNDLE_VERSION alone.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
          ref: ${{ env.BUNDLE_VERSION }}

      - name: Resolve Helm chart version
        id: helm-version
        run: |
          set -euo pipefail
          CHART_FILE="helm/aerospike-backup-service/Chart.yaml"
          if [ ! -f "$CHART_FILE" ]; then
            echo "Chart file not found at $CHART_FILE" >&2
            exit 1
          fi
          HELM_VERSION=$(yq '.version' "$CHART_FILE" | tr -d '\n')
          if [ -z "$HELM_VERSION" ]; then
            echo "Failed to extract Helm chart version." >&2
            exit 1
          fi
          echo "HELM_VERSION=$HELM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to JFrog
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: ${{ vars.JF_ARTIFACTORY_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JF_OIDC_AUDIENCE }}

      - name: Download signed artifacts from JFrog PROD
        env:
          HELM_VERSION: ${{ steps.helm-version.outputs.HELM_VERSION }}
          DEB_REPO: ${{ vars.JF_ARTIFACTORY_DEB_PROD }}
          RPM_REPO: ${{ vars.JF_ARTIFACTORY_RPM_PROD }}
          HELM_REPO: ${{ vars.JF_ARTIFACTORY_HELM_PROD }}
        run: |
          set -euxo pipefail
          # jf rt search's --bundle filter turned out not to reliably list release-bundle
          # members on our JFrog instance (verified empty against a real, promoted bundle;
          # same for --build, the bundle signature API, and release-bundle-export). Instead,
          # filter each PROD-public repo directly by the "version" property that
          # reusable_deploy-artifacts.yaml stamps on every artifact it deploys -- verified
          # live to return exact, reliable matches with full metadata (including sha256).
          mkdir -p release-assets

          echo "Searching ${DEB_REPO} for version=${BUNDLE_VERSION}..."
          jf rt search "${DEB_REPO}/**" --props "version=${BUNDLE_VERSION}" > deb-artifacts.json
          echo "Searching ${RPM_REPO} for version=${BUNDLE_VERSION}..."
          jf rt search "${RPM_REPO}/**" --props "version=${BUNDLE_VERSION}" > rpm-artifacts.json
          echo "Searching ${HELM_REPO} for version=${HELM_VERSION}..."
          jf rt search "${HELM_REPO}/**" --props "version=${HELM_VERSION}" > helm-artifacts.json

          jq -s 'add' deb-artifacts.json rpm-artifacts.json helm-artifacts.json > all-artifacts.json

          # Those repos are shared by every product in the JFrog project and the only filter
          # above is the `version` property, so another product carrying the same version
          # string comes back in the same result set -- absctl and aerospike-backup-service
          # both published v0.0.0-test-... into database-*-test-local, and a run there matched
          # 20 artifacts of each, which would have attached the other product's packages to
          # this release. Keep only this bundle's own artifacts: nfpm and helm name them
          # "<pkg>_<version>_<arch>.deb", "<pkg>-<version>-<release>.<arch>.rpm" and
          # "<pkg>-<chart-version>.tgz".
          jq --arg pkg "${BUNDLE_NAME}" '[ .[] | select(
               (.path | split("/") | last) as $f
               | ($f | startswith($pkg + "_")) or ($f | startswith($pkg + "-"))
             ) ]' all-artifacts.json > bundle-artifacts.json
          cat bundle-artifacts.json

          jq -r '.[].path' bundle-artifacts.json > artifact-paths.txt
          if [ ! -s artifact-paths.txt ]; then
            echo "::error::No ${BUNDLE_NAME} package/Helm artifacts found for ${BUNDLE_NAME}:${BUNDLE_VERSION} (helm ${HELM_VERSION}) in ${DEB_REPO}, ${RPM_REPO}, or ${HELM_REPO} (searched $(jq 'length' all-artifacts.json) artifact(s) at those versions, none of them ${BUNDLE_NAME}'s)." >&2
            exit 1
          fi

          echo "Artifacts to download:"
          cat artifact-paths.txt

          while IFS= read -r artifact_path; do
            jf rt download "${artifact_path}" release-assets/ --flat=true
            # GPG/prov signature files are deterministic siblings of the primary artifact and
            # don't carry their own "version" property, so fetch them by direct sibling path
            # instead of a second search.
            jf rt download "${artifact_path}.asc" release-assets/ --flat=true --fail-no-op=false || true
            jf rt download "${artifact_path}.prov" release-assets/ --flat=true --fail-no-op=false || true
          done < artifact-paths.txt

      - name: Write checksums from JFrog metadata
        run: |
          set -euxo pipefail
          # JFrog already computes and stores a sha256 for every artifact (visible in
          # bundle-artifacts.json above) -- write out that recorded checksum instead of
          # re-hashing the downloaded file locally, so the .sha256 we publish is JFrog's own
          # recorded value for this immutable artifact, not something recomputed here.
          jq -r '.[] | select(.path | test("\\.(deb|rpm)$")) | "\(.path)\t\(.sha256)"' bundle-artifacts.json |
          while IFS=$'\t' read -r artifact_path sha256; do
            filename="$(basename "$artifact_path")"
            echo "$sha256" > "release-assets/${filename}.sha256"
          done

          echo "Final release-assets tree:"
          find release-assets -type f | sort

      - name: Publish GitHub pre-release
        uses: step-security/action-gh-release@d2093dbdaf0c6507874908247e14bbc4dee6a72d # v3.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.BUNDLE_VERSION }}
          draft: false
          prerelease: true
          make_latest: false
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.BUNDLE_VERSION }}/CHANGELOG.md) for details on this release, and [docs/migration.md](https://github.com/${{ github.repository }}/blob/${{ env.BUNDLE_VERSION }}/docs/migration.md) for upgrade/breaking-change notes.
          files: |
            release-assets/**/*.rpm
            release-assets/**/*.deb
            release-assets/**/*.deb.asc
            release-assets/**/*.rpm.asc
            release-assets/**/*.sha256
            release-assets/**/*.tgz
            release-assets/**/*.tgz.prov

      - name: Summarize published release
        if: always()
        run: |
          {
            echo "### Published GitHub pre-release"
            echo "Tag: \`${BUNDLE_VERSION}\`"
            echo ""
            echo "Clear **Set as a pre-release** in the GitHub Release UI when ready to announce GA."
            echo ""
            echo "Docker Hub and other public registries are published by artifact-publisher off the PROD promotion webhook, not here."
            echo ""
            echo '```'
            find release-assets -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
