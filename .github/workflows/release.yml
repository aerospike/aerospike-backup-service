name: Publish Aerospike Backup Service Release (Shared Workflows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (must match a release bundle already promoted to TEST, e.g. v3.7.0)
        required: true
        type: string

permissions:
  contents: read

# TEMPORARY (testing only): this workflow tracks the TEST stage instead of PROD. Revert
# `JF_TARGET_ENV` and the `JF_*_REPO` values below before merging to main.
env:
  JF_TARGET_ENV: TEST
  JF_DEB_REPO: database-deb-test-local
  JF_RPM_REPO: database-rpm-test-local
  JF_HELM_REPO: database-helm-test-local
  DOCKERHUB_IMAGE: aerospike/aerospike-backup-service

# This workflow is run manually, once the release bundle has already been promoted all the way to
# JFrog PROD via the JFrog UI by a PM/EM (see docs/development.md "Cutting a release" -- gates past
# TEST are product-owned and intentionally not automated in CI). It never promotes anything itself;
# it only verifies the target promotion happened, then republishes the already-signed artifacts as an
# immutable GitHub pre-release. A PM/EM promotes it to a full (non-prerelease) GitHub Release manually
# when ready to announce GA. Nothing is rebuilt, re-signed, or re-checksummed here -- JFrog is the
# source of truth. The immutable version tag on Docker Hub is mirrored externally by
# artifact-publisher (https://aerospike.atlassian.net/wiki/spaces/DevOps/pages/4648566799), triggered
# by JFrog's promotion webhook; this workflow alone updates the Docker Hub `latest` tag when this
# version is the highest final release overall.
#
# All `vars.JF_*` used below are dedicated to this pipeline (targets the "database" JFrog
# project) and are independent of the unprefixed `vars.*` used by release-legacy.yml
# (targets "ecosystem") — never share values between the two.

jobs:
  verify-prod-promotion:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    env:
      BUNDLE_NAME: ${{ github.event.repository.name }}
      BUNDLE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Login to JFrog
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: ${{ vars.JF_ARTIFACTORY_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JF_OIDC_AUDIENCE }}

      - name: Check release bundle is promoted to ${{ env.JF_TARGET_ENV }}
        env:
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        run: |
          set -euxo pipefail
          if [ -z "${BUNDLE_VERSION}" ]; then
            echo "::error::version input is required (e.g. v3.7.0)."
            exit 1
          fi

          echo "Checking promotion history for ${BUNDLE_NAME}:${BUNDLE_VERSION} (project: ${JF_PROJECT})..."
          RESPONSE=$(jf rt curl -s "/lifecycle/api/v2/promotion/records/${BUNDLE_NAME}/${BUNDLE_VERSION}?project=${JF_PROJECT}")
          echo "$RESPONSE" | jq .

          COMPLETED_TARGET=$(echo "$RESPONSE" | jq --arg env "${JF_TARGET_ENV}" '[.promotions[]? | select(.environment == $env and .status == "COMPLETED")] | length')
          if [ "$COMPLETED_TARGET" -lt 1 ]; then
            echo "::error::Release bundle ${BUNDLE_NAME}:${BUNDLE_VERSION} has no COMPLETED promotion to ${JF_TARGET_ENV}. Promote it via the JFrog UI, then re-run this workflow."
            exit 1
          fi

          echo "Confirmed: ${BUNDLE_NAME}:${BUNDLE_VERSION} is promoted to ${JF_TARGET_ENV}."

      - name: Summarize verification
        if: always()
        run: |
          {
            echo "### ${{ env.JF_TARGET_ENV }} promotion check"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Bundle name | \`${BUNDLE_NAME}\` |"
            echo "| Bundle version | \`${BUNDLE_VERSION}\` |"
            echo "| JFrog project | \`${{ vars.JF_PROJECT }}\` |"
            echo "| Target environment | \`${{ env.JF_TARGET_ENV }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-github-release:
    needs: [verify-prod-promotion]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    env:
      BUNDLE_NAME: ${{ github.event.repository.name }}
      BUNDLE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Needed only to read the Helm chart's own version out of Chart.yaml at this tag --
      # the chart's version is tracked independently of the package version (see prepare's
      # HELM_VERSION vs PACKAGE_VERSION in pre-release.yml), so it can't be derived from
      # BUNDLE_VERSION alone.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
          ref: ${{ env.BUNDLE_VERSION }}

      - name: Resolve Helm chart version
        id: helm-version
        run: |
          set -euo pipefail
          CHART_FILE="helm/aerospike-backup-service/Chart.yaml"
          if [ ! -f "$CHART_FILE" ]; then
            echo "Chart file not found at $CHART_FILE" >&2
            exit 1
          fi
          HELM_VERSION=$(yq '.version' "$CHART_FILE" | tr -d '\n')
          if [ -z "$HELM_VERSION" ]; then
            echo "Failed to extract Helm chart version." >&2
            exit 1
          fi
          echo "HELM_VERSION=$HELM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve Docker latest tag
        id: docker-latest
        run: |
          set -euo pipefail
          current="${BUNDLE_VERSION#v}"

          if ! echo "$current" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "APPLY_DOCKER_LATEST=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Docker \`latest\` tag"
              echo "Pre-release/test tag; Docker \`latest\` is not updated."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          versions="$(
            { git tag --list 'v*'; echo "v${current}"; } \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^v//' \
              | sort -uV
          )"
          highest_overall="$(echo "$versions" | tail -n1)"

          if [ "$current" = "$highest_overall" ]; then
            apply_latest=true
          else
            apply_latest=false
          fi
          echo "APPLY_DOCKER_LATEST=$apply_latest" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$current" >> "$GITHUB_OUTPUT"

          {
            echo "### Docker \`latest\` tag"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Publishing | \`$current\` |"
            echo "| Highest release overall | \`$highest_overall\` |"
            echo "| Update Docker Hub \`latest\` | \`$apply_latest\` |"
            echo ""
            if [ "$apply_latest" = "true" ]; then
              echo "This is the highest final release, so Docker Hub \`latest\` will point at \`${current}\`."
            else
              echo "Newer final releases exist, so Docker Hub \`latest\` is left unchanged."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to JFrog
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: ${{ vars.JF_ARTIFACTORY_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JF_OIDC_AUDIENCE }}

      - name: Download signed artifacts from JFrog ${{ env.JF_TARGET_ENV }}
        env:
          HELM_VERSION: ${{ steps.helm-version.outputs.HELM_VERSION }}
          DEB_REPO: ${{ env.JF_DEB_REPO }}
          RPM_REPO: ${{ env.JF_RPM_REPO }}
          HELM_REPO: ${{ env.JF_HELM_REPO }}
        run: |
          set -euxo pipefail
          # jf rt search's --bundle filter turned out not to reliably list release-bundle
          # members on our JFrog instance (verified empty against a real, promoted bundle;
          # same for --build, the bundle signature API, and release-bundle-export). Instead,
          # filter each target-stage repo directly by the "version" property that
          # reusable_deploy-artifacts.yaml stamps on every artifact it deploys -- verified
          # live to return exact, reliable matches with full metadata (including sha256).
          mkdir -p release-assets

          echo "Searching ${DEB_REPO} for version=${BUNDLE_VERSION}..."
          jf rt search "${DEB_REPO}/**" --props "version=${BUNDLE_VERSION}" > deb-artifacts.json
          echo "Searching ${RPM_REPO} for version=${BUNDLE_VERSION}..."
          jf rt search "${RPM_REPO}/**" --props "version=${BUNDLE_VERSION}" > rpm-artifacts.json
          echo "Searching ${HELM_REPO} for version=${HELM_VERSION}..."
          jf rt search "${HELM_REPO}/**" --props "version=${HELM_VERSION}" > helm-artifacts.json

          jq -s 'add' deb-artifacts.json rpm-artifacts.json helm-artifacts.json > bundle-artifacts.json
          cat bundle-artifacts.json

          jq -r '.[].path' bundle-artifacts.json > artifact-paths.txt
          if [ ! -s artifact-paths.txt ]; then
            echo "::error::No package/Helm artifacts found for ${BUNDLE_NAME}:${BUNDLE_VERSION} (helm ${HELM_VERSION}) in ${DEB_REPO}, ${RPM_REPO}, or ${HELM_REPO}." >&2
            exit 1
          fi

          echo "Artifacts to download:"
          cat artifact-paths.txt

          while IFS= read -r artifact_path; do
            jf rt download "${artifact_path}" release-assets/ --flat=true
            # GPG/prov signature files are deterministic siblings of the primary artifact and
            # don't carry their own "version" property, so fetch them by direct sibling path
            # instead of a second search.
            jf rt download "${artifact_path}.asc" release-assets/ --flat=true --fail-no-op=false || true
            jf rt download "${artifact_path}.prov" release-assets/ --flat=true --fail-no-op=false || true
          done < artifact-paths.txt

      - name: Write checksums from JFrog metadata
        run: |
          set -euxo pipefail
          # JFrog already computes and stores a sha256 for every artifact (visible in
          # bundle-artifacts.json above) -- write out that recorded checksum instead of
          # re-hashing the downloaded file locally, so the .sha256 we publish is JFrog's own
          # recorded value for this immutable artifact, not something recomputed here.
          jq -r '.[] | select(.path | test("\\.(deb|rpm)$")) | "\(.path)\t\(.sha256)"' bundle-artifacts.json |
          while IFS=$'\t' read -r artifact_path sha256; do
            filename="$(basename "$artifact_path")"
            echo "$sha256" > "release-assets/${filename}.sha256"
          done

          echo "Final release-assets tree:"
          find release-assets -type f | sort

      - name: Publish GitHub pre-release
        uses: step-security/action-gh-release@d2093dbdaf0c6507874908247e14bbc4dee6a72d # v3.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.BUNDLE_VERSION }}
          draft: false
          prerelease: true
          make_latest: false
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.BUNDLE_VERSION }}/CHANGELOG.md) for details on this release, and [docs/migration.md](https://github.com/${{ github.repository }}/blob/${{ env.BUNDLE_VERSION }}/docs/migration.md) for upgrade/breaking-change notes.
          files: |
            release-assets/**/*.rpm
            release-assets/**/*.deb
            release-assets/**/*.deb.asc
            release-assets/**/*.rpm.asc
            release-assets/**/*.sha256
            release-assets/**/*.tgz
            release-assets/**/*.tgz.prov

      - name: Set up Docker Buildx
        if: steps.docker-latest.outputs.APPLY_DOCKER_LATEST == 'true' && env.JF_TARGET_ENV == 'PROD'
        uses: step-security/setup-buildx-action@a4709e2865773e1792246433e8eb922f9743a875 # v4.2.0

      - name: Login to DockerHub
        if: steps.docker-latest.outputs.APPLY_DOCKER_LATEST == 'true' && env.JF_TARGET_ENV == 'PROD'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Wait for DockerHub version tag
        if: steps.docker-latest.outputs.APPLY_DOCKER_LATEST == 'true' && env.JF_TARGET_ENV == 'PROD'
        id: dockerhub-version
        uses: ./.github/actions/wait-for-dockerhub-tag
        with:
          image: ${{ env.DOCKERHUB_IMAGE }}
          tag: ${{ steps.docker-latest.outputs.IMAGE_TAG }}

      - name: Point DockerHub latest at this release
        if: steps.docker-latest.outputs.APPLY_DOCKER_LATEST == 'true' && env.JF_TARGET_ENV == 'PROD' && steps.dockerhub-version.outputs.found == 'true'
        run: |
          set -euxo pipefail
          docker buildx imagetools create \
            "docker.io/${DOCKERHUB_IMAGE}:${{ steps.docker-latest.outputs.IMAGE_TAG }}" \
            --tag "docker.io/${DOCKERHUB_IMAGE}:latest"

      - name: Summarize published release
        if: always()
        run: |
          {
            echo "### Published GitHub pre-release"
            echo "Tag: \`${BUNDLE_VERSION}\`"
            echo ""
            echo "Clear **Set as a pre-release** in the GitHub Release UI when ready to announce GA."
            if [ "${{ steps.docker-latest.outputs.APPLY_DOCKER_LATEST }}" = "true" ] && [ "${{ env.JF_TARGET_ENV }}" = "PROD" ]; then
              if [ "${{ steps.dockerhub-version.outputs.found }}" = "true" ]; then
                echo ""
                echo "Docker Hub \`latest\` now points at \`${{ steps.docker-latest.outputs.IMAGE_TAG }}\`."
              else
                echo ""
                echo "::warning::Docker Hub \`latest\` was not updated — version tag \`${{ steps.docker-latest.outputs.IMAGE_TAG }}\` is not on Docker Hub yet (artifact-publisher mirroring may still be in progress). Re-run this workflow to retry."
              fi
            elif [ "${{ steps.docker-latest.outputs.APPLY_DOCKER_LATEST }}" = "true" ] && [ "${{ env.JF_TARGET_ENV }}" != "PROD" ]; then
              echo ""
              echo "Docker Hub \`latest\` update skipped (promotion target is \`${{ env.JF_TARGET_ENV }}\`, not PROD)."
            fi
            echo ""
            echo '```'
            find release-assets -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
