name: Validate aerospike-backup-service configuration against JSON Schema

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-abs-config-file:
    runs-on: ubuntu-24.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install check-jsonschema

      - name: Install yq
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b #v1.3.1
        with:
          version: "v4.45.4"

      - name: Validate aerospike-backup-service.yml files against config.schema.json
        run: |
          echo "Starting JSON Schema validation using check-jsonschema"
          echo "Using schema: ./docs/config.schema.json"
          echo "------------------------------------------------------------"
          
          SCHEMA=./docs/config.schema.json
          EXIT_CODE=0
          
          echo "Searching for all aerospike-backup-service.yml files..."
          # Read from process substitution rather than a pipe: a piped `while` runs in a
          # subshell, and EXIT_CODE=1 set there never reaches the `exit` below.
          while read -r file; do
            echo ""
            echo "Validating dynamically discovered file: $file"
            if check-jsonschema --verbose --schemafile "$SCHEMA" "$file"; then
              echo "PASSED: $file"
            else
              echo "FAILED: $file"
              EXIT_CODE=1
            fi
          done < <(find . -type f -name 'aerospike-backup-service.yml')
          
          echo ""
          echo "Validating additional explicitly listed files..."
          
          for file in \
            .github/config/test-chart-abs-conf.yaml \
            ./config/config.yml
          do
            echo ""
            echo "Validating file: $file"
            if check-jsonschema --verbose --schemafile "$SCHEMA" "$file"; then
              echo "PASSED: $file"
            else
              echo "FAILED: $file"
              EXIT_CODE=1
            fi
          done
          
          echo ""
          echo "------------------------------------------------------------"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "One or more files failed schema validation"
          else
            echo "All files passed schema validation"
          fi
          
          exit $EXIT_CODE
