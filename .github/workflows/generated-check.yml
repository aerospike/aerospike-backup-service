# Job for generated-artifact checks (mocks, readme, examples).
# Fails if they are out of date. Run "make mocks-generate" and "make readme" locally and commit the changes.
name: Generated files up to date

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'v[0-9]+'

permissions:
  contents: read

jobs:
  generated-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Get go version from go.mod
        run: |
          echo "GO_VERSION=$(grep '^go ' go.mod | cut -d " " -f 2)" >> $GITHUB_ENV

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check generated files are up to date
        run: make generated-check
