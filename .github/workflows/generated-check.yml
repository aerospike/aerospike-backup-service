# Job for generated-artifact checks (mocks, readme, examples).
# Fails if they are out of date. Run "make mocks-generate" and "make readme" locally and commit the changes.
name: Generated files up to date

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'v[0-9]+'

permissions:
  contents: read

jobs:
  generated-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Get go version from go.mod
        run: |
          echo "GO_VERSION=$(grep '^go ' go.mod | cut -d " " -f 2)" >> $GITHUB_ENV

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check generated files are up to date
        run: make generated-check
