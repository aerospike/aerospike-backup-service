# Job for generated-artifact checks (mocks, OpenAPI, readme, examples).
# Fails if they are out of date. Run "make mocks-generate", "make openapi", and "make readme" locally and commit.
name: Generated files up to date

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'v[0-9]+'

permissions:
  contents: read

jobs:
  generated-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Get go version from go.mod
        run: |
          echo "GO_VERSION=$(grep '^go ' go.mod | cut -d " " -f 2)" >> $GITHUB_ENV

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Check generated files are up to date
        run: make generated-check
