# Job for generated-artifact checks (mocks, readme, examples).
# Fails if they are out of date. Run "make mocks-generate" and "make readme" locally and commit the changes.
name: Generated files up to date

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'v[0-9]+'

permissions:
  contents: read

jobs:
  generated-check:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Get go version from go.mod
        run: |
          echo "GO_VERSION=$(grep '^go ' go.mod | cut -d " " -f 2)" >> $GITHUB_ENV

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check generated files are up to date
        run: make generated-check
