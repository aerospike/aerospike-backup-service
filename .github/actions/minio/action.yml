name: MinIO test bucket
description: >
  mode=deploy: runs a single MinIO server (Deployment and Service "minio", credentials
  minioadmin/minioadmin) and a long-lived curl pod "s3", then creates the bucket.
  mode=list-objects: lists the bucket's object keys and fails if it is empty.
  minio/minio and minio/mc are no longer published on Docker Hub, so the server runs
  coollabsio/minio and S3 requests are SigV4-signed curl calls from the "s3" pod.

inputs:
  mode:
    description: "'deploy' or 'list-objects'"
    required: true
  kubectl-namespace:
    description: Kubernetes namespace for MinIO and the s3 pod
    required: true
  bucket:
    description: Bucket name
    required: true

runs:
  using: composite
  steps:
    - name: Deploy MinIO and create the bucket
      if: inputs.mode == 'deploy'
      shell: bash
      env:
        K8S_NAMESPACE: ${{ inputs.kubectl-namespace }}
        BUCKET: ${{ inputs.bucket }}
      run: |
        set -euo pipefail
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: minio
          namespace: ${K8S_NAMESPACE}
        spec:
          replicas: 1
          selector:
            matchLabels: { app: minio }
          template:
            metadata:
              labels: { app: minio }
            spec:
              containers:
                - name: minio
                  image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
                  args: ["server", "/data"]
                  env:
                    - name: MINIO_ROOT_USER
                      value: minioadmin
                    - name: MINIO_ROOT_PASSWORD
                      value: minioadmin
                  ports:
                    - containerPort: 9000
                  readinessProbe:
                    httpGet: { path: /minio/health/ready, port: 9000 }
                    initialDelaySeconds: 5
                    periodSeconds: 5
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: minio
          namespace: ${K8S_NAMESPACE}
        spec:
          selector: { app: minio }
          ports:
            - port: 9000
              targetPort: 9000
        EOF
        kubectl wait --for=condition=Available deployment/minio --namespace "$K8S_NAMESPACE" --timeout=180s

        kubectl run s3 --image=curlimages/curl:8.22.0 -n "$K8S_NAMESPACE" --restart=Never --command -- sleep 3600
        kubectl wait --for=condition=Ready pod/s3 -n "$K8S_NAMESPACE" --timeout=120s
        # 409 means the bucket already exists.
        STATUS="$(kubectl exec -n "$K8S_NAMESPACE" s3 -- curl -s -o /dev/null -w '%{http_code}' -X PUT \
          --user minioadmin:minioadmin --aws-sigv4 aws:amz:us-east-1:s3 "http://minio:9000/${BUCKET}")"
        case "$STATUS" in
          200|409) echo "Bucket ${BUCKET} ready (HTTP $STATUS)" ;;
          *) echo "::error::Creating bucket ${BUCKET} returned HTTP $STATUS"; exit 1 ;;
        esac

    - name: List the bucket's objects
      if: inputs.mode == 'list-objects'
      shell: bash
      env:
        K8S_NAMESPACE: ${{ inputs.kubectl-namespace }}
        BUCKET: ${{ inputs.bucket }}
      run: |
        set -euo pipefail
        KEYS="$(kubectl exec -n "$K8S_NAMESPACE" s3 -- curl -sf --user minioadmin:minioadmin --aws-sigv4 aws:amz:us-east-1:s3 \
          "http://minio:9000/${BUCKET}?list-type=2" | grep -o '<Key>[^<]*</Key>' || true)"
        printf '%s\n' "$KEYS"
        [ -n "$KEYS" ] || { echo "::error::No objects found in MinIO bucket ${BUCKET}"; exit 1; }

    - name: Reject an unknown mode
      if: inputs.mode != 'deploy' && inputs.mode != 'list-objects'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        echo "::error::Unknown mode '${MODE}'; expected deploy or list-objects"
        exit 1
