version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: gomod
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns:
      - "*"
    open-pull-requests-limit: 1
