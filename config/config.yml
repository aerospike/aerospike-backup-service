# yaml-language-server: $schema=https://raw.githubusercontent.com/aerospike/aerospike-backup-service/refs/heads/v3/docs/config.schema.json
aerospike-clusters:
  absDefaultCluster:
    seed-nodes:
      - host-name: "localhost"
        port: 3000
    credentials:
      user: "tester"
      password: "psw"
    max-parallel-scans: 20

storage:
  local:
    local-storage:
      path: ./localStorage
  minio:
    s3-storage:
      path: storage1
      bucket: as-backup-bucket
      s3-region: eu-central-1
      s3-profile: minio
      s3-endpoint-override: http://localhost:9000

backup-policies:
  defaultPolicy:
    parallel: 8
    sealed: true
    retry-policy:
      base-timeout: 3_000
      max-retries: 10
      multiplier: 1
    retention:
      full: 10
      incremental: 10
  withFileLimit:
    file-limit: 1
    parallel: 1
    sealed: true
    retry-policy:
      base-timeout: 1_000
      max-retries: 1
      multiplier: 1
    retention:
      full: 10
      incremental: 10
  withBandwidthLimit:
    bandwidth: 1
    parallel: 1
    sealed: true
    retry-policy:
      base-timeout: 1_000
      max-retries: 1
      multiplier: 1
    retention:
      full: 10
      incremental: 10
  removeFilesPolicy:
    parallel: 8
    retention:
      full: 1
      incremental: 0
    sealed: true
  removeIncrementalPolicy:
    parallel: 8
    retention:
      full: 10
      incremental: 0
    sealed: true
  encryptedCompressedPolicy128:
    parallel: 8
    retention:
      full: 1
      incremental: 0
    sealed: true
    encryption:
      key-file: encryptionKey
      mode: AES128
    compression:
      level: 20
      mode: ZSTD
  encryptedCompressedPolicy256:
    parallel: 8
    retention:
      full: 1
      incremental: 0
    sealed: true
    encryption:
      key-env: BACKUP_ENCRYPTION_KEY
      mode: AES256
    compression:
      level: 10
      mode: ZSTD
  notSealed:
    parallel: 8
    sealed: false
    retention:
      full: 10
      incremental: 10
  noIndexesUdfsRecords:
    parallel: 8
    sealed: true
    no-indexes: true
    no-records: true
    no-udfs: true
    retention:
      full: 10
  xdrBackup:
    parallel: 8
    retention:
      full: 10
      incremental: 10
    xdr:
      local-host: "localhost"
backup-routines:
  fullBackupSlow:
    interval-cron: "@yearly"
    source-cluster: absDefaultCluster
    storage: local
    namespaces: [ "source-ns13" ]
    backup-policy: withBandwidthLimit


service:
  logger:
    file-writer:
      filename: "log/backup-service.log"
    level: DEBUG
