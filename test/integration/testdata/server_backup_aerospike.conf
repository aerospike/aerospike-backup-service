# Single-node cluster for the server-side backup tests (serverbuild.go). Namespace bar is
# on a file device: fuzzy restore requires SSD storage.

service {
	feature-key-file /etc/aerospike/features.conf
	cluster-name server-backup
	proto-fd-max 1024
	work-directory /opt/aerospike
}

mod-lua {
	user-path /opt/aerospike/usr/udf/lua
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		port 3001
	}
}

namespace bar {
	replication-factor 1

	storage-engine device {
		file /opt/aerospike/data/bar.dat
		filesize 1G
	}
}
